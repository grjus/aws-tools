[project]
name = "aws-tools"
version = "0.1.0"
description = "Daily AWS CLI tools for resource reporting and guarded cleanup"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
]

[project.scripts]
aws-tools = "aws_tools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
